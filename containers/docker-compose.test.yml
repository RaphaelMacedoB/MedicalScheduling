services:

  postgres-test:
    image: postgres:16

    container_name: medical-postgres-test

    environment:
      POSTGRES_DB: medical_scheduling_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5433:5432"

    restart: always

  redis-test:
    image: redis:7

    container_name: medical-redis-test

    ports:
      - "6380:6379"

    restart: always
