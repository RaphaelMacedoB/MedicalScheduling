services:

  medical-api:
    container_name: medical-api

    build:
      context: ../
      dockerfile: src/MedicalScheduling.Presentation/Dockerfile

    ports:
      - "8080:8080"

    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=medical_scheduling;Username=postgres;Password=postgres
      Redis__Connection: redis:6379

    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16

    container_name: medical-postgres

    environment:
      POSTGRES_DB: medical_scheduling
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

  redis:
    image: redis:7

    container_name: medical-redis

    ports:
      - "6379:6379"
